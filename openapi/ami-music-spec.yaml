openapi: 3.1.0
info:
  title: (title)
  version: 0.0.0
tags: []
paths: {}
components:
  schemas:
    Chord:
      type: object
      required:
        - duration
        - noteAttributes
        - pitches
        - rootNote
      properties:
        duration:
          $ref: '#/components/schemas/NoteDuration'
        noteAttributes:
          $ref: '#/components/schemas/NoteAttributes'
        pitches:
          type: array
          items:
            $ref: '#/components/schemas/Pitch'
        rootNote:
          $ref: '#/components/schemas/Pitch'
    ChordDegree:
      type: object
      required:
        - value
        - alter
        - type
      properties:
        value:
          type: integer
          format: int32
          description: 2…13
        alter:
          type: integer
          format: int32
          description: −2…2
        type:
          type: string
          description: ADD | ALTER | SUBTRACT
    ChordSymbol:
      type: object
      required:
        - kind
      properties:
        root:
          type: string
          description: NoteName; absent only when kind is NONE.
        kind:
          type: string
          description: ChordKind, e.g. MAJOR, MINOR, DOMINANT, MAJOR_SEVENTH, SUSPENDED_FOURTH, NONE.
        kindText:
          type: string
          description: The kind as written, e.g. "m7" or "-7" (MusicXML <kind text>). At most 32 characters.
        degrees:
          type: array
          items:
            $ref: '#/components/schemas/ChordDegree'
          description: Alterations of the chord, e.g. add9.
        bass:
          type: string
          description: NoteName of the bass, for slash chords such as C/G.
      description: A chord symbol as in MusicXML's <harmony>.
    Fraction:
      type: object
      required:
        - numerator
        - denominator
      properties:
        numerator:
          type: integer
          format: int32
        denominator:
          type: integer
          format: int32
      description: A non-negative rational number in lowest terms, e.g. a position within a measure as a fraction of a whole note. Zero is 0/1.
    Harmony:
      type: object
      required:
        - offset
        - chord
      properties:
        offset:
          $ref: '#/components/schemas/Fraction'
          description: "Position within the measure as a fraction of a whole note: 0 ≤ offset < the measure's length."
        chord:
          $ref: '#/components/schemas/ChordSymbol'
      description: A chord symbol at a position in a measure.
    Key:
      type: object
      required:
        - fifths
        - mode
      properties:
        fifths:
          type: integer
          format: int32
        mode:
          type: string
    LyricFragment:
      type: object
      required:
        - offset
        - text
      properties:
        offset:
          $ref: '#/components/schemas/Fraction'
          description: "Position within the measure as a fraction of a whole note: 0 ≤ offset < the measure's length."
        text:
          type: string
          description: The text exactly as written, including leading and trailing spaces. 1 to 512 characters.
        verse:
          type: integer
          format: int32
          description: Verse number, 1 to 99. Absent means verse 1.
      description: A piece of lyrics at a position in a measure.
    Measure:
      type: object
      required:
        - notes
      properties:
        attributes:
          $ref: '#/components/schemas/MeasureAttributes'
        pickup:
          $ref: '#/components/schemas/Fraction'
          description: 'First measure of a part only: its real length as a fraction of a whole note, when shorter than the time signature.'
        harmonies:
          type: array
          items:
            $ref: '#/components/schemas/Harmony'
          description: Chord symbols in this measure, by position. Offsets strictly increase and lie within the measure.
        lyrics:
          type: array
          items:
            $ref: '#/components/schemas/LyricFragment'
          description: Lyric fragments in this measure, by position and verse. Offsets strictly increase within each verse.
        textDirections:
          type: array
          items:
            $ref: '#/components/schemas/TextDirection'
          description: Text directions in this measure, by position. Offsets don't decrease and lie within 0 ≤ offset ≤ the measure's length.
        lineBreaks:
          type: array
          items:
            $ref: '#/components/schemas/Fraction'
          description: Offsets within the measure where a new line starts. Strictly increasing, 0 ≤ offset < the measure's length.
        sectionStarts:
          type: array
          items:
            $ref: '#/components/schemas/SectionStart'
          description: Where a new section (verse, chorus) starts in this measure. Offsets strictly increase and lie within the measure.
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Pitched'
    MeasureAttributes:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/Key'
        time:
          $ref: '#/components/schemas/TimeSignature'
        tempo:
          $ref: '#/components/schemas/Tempo'
    NoteAttributes:
      type: object
      properties:
        attack:
          type: number
          format: float
        dynamics:
          type: number
          format: float
        endDynamics:
          type: number
          format: float
        release:
          type: number
          format: float
    NoteDuration:
      type: object
      required:
        - noteValue
        - modifier
      properties:
        noteValue:
          type: string
        modifier:
          type: string
    Part:
      type: object
      required:
        - id
        - measures
      properties:
        id:
          type: string
        name:
          type: string
        instrument:
          $ref: '#/components/schemas/PartInstrument'
        measures:
          type: array
          items:
            $ref: '#/components/schemas/Measure'
    PartInstrument:
      type: object
      properties:
        name:
          type: string
        midiChannel:
          type: integer
          format: int8
        midiProgram:
          type: integer
          format: int8
    Pitch:
      type: object
      required:
        - alter
        - noteName
        - octave
      properties:
        alter:
          type: number
          format: float
        noteName:
          type: string
        octave:
          type: integer
          format: int8
    Pitched:
      type: object
      required:
        - duration
        - noteAttributes
        - pitch
      properties:
        duration:
          $ref: '#/components/schemas/NoteDuration'
        noteAttributes:
          $ref: '#/components/schemas/NoteAttributes'
        pitch:
          $ref: '#/components/schemas/Pitch'
    Rest:
      type: object
      required:
        - duration
        - noteAttributes
      properties:
        duration:
          $ref: '#/components/schemas/NoteDuration'
        noteAttributes:
          $ref: '#/components/schemas/NoteAttributes'
    Score:
      type: object
      required:
        - id
        - parts
      properties:
        id:
          type: string
        title:
          type: string
        parts:
