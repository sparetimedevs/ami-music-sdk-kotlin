    SectionStart:
      type: object
      required:
        - offset
      properties:
        offset:
          $ref: '#/components/schemas/Fraction'
          description: "Position within the measure as a fraction of a whole note: 0 ≤ offset < the measure's length."
        label:
          type: string
          description: Optional section name, such as "Couplet". Not empty after trimming, at most 64 characters.
      description: The start of a new section of the song, such as a verse or a chorus.
    Tempo:
      type: object
      required:
        - quarterNotesPerMinute
      properties:
        quarterNotesPerMinute:
          type: integer
          format: int32
    TextDirection:
